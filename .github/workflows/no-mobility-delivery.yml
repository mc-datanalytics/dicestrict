name: Automatic movement source delivery
on:
  push:
    branches: ['feat/remove-mobility']
    paths: ['.github/workflows/no-mobility-delivery.yml']
permissions:
  contents: write
concurrency:
  group: automatic-movement-delivery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify and materialize bounded source edits
        run: |
          python - <<'PY'
          import pathlib, base64, gzip, hashlib, json
          encoded=''.join(pathlib.Path(f'.github/no-mobility-part-{i}.txt').read_text().strip() for i in range(3))
          pathlib.Path('received-payload.txt').write_text(encoded)
          assert len(encoded)==22712
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(raw)==49736
          assert hashlib.sha256(raw).hexdigest()=='b6900a43d109851c3d199f91eb0d1a41a3ac5feb39a5a994a76b54f4016ccfc7'
          sha=lambda text:hashlib.sha256(text.encode()).hexdigest()
          patches=json.loads(raw)
          assert len(patches)==35
          for name,patch in patches.items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in {'src','scripts','tests','docs'} or name in {'README.md','CHANGELOG.md','SECURITY.md','package.json','lab.html'}
              assert not name.startswith(('src/scene/','scripts/assets/'))
              if patch['before'] is None:
                  assert not p.exists(),f'Unexpected existing file {name}'
                  text=patch['content']
              else:
                  text=p.read_text()
                  assert sha(text)==patch['before'],f'Baseline mismatch: {name}'
                  for start,end,replacement in reversed(patch['edits']):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              assert sha(text)==patch['after'],f'Output mismatch: {name}'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
              print('Verified',name,patch['after'])
          PY
      - name: Static checks, regressions and standalone builds
        run: |
          set -euo pipefail
          npm run check
          npm test | tee automatic-node-tests.txt
          npm run build:lab
      - name: Publish plain sources without modifying workflows
        run: |
          git rm .github/no-mobility-part-*.txt
          git add src/game src/lab src/network src/ui scripts/automatic-baseline.mjs scripts/balance.mjs scripts/fair-opening.mjs scripts/source-meta.mjs tests docs README.md CHANGELOG.md SECURITY.md package.json lab.html
          git -c user.name='M&G Group' -c user.email='119437439+mc-datanalytics@users.noreply.github.com' commit -m 'feat: remove Mobility and resolve movement directly on roll'
          git push origin HEAD:refs/heads/feat/remove-mobility
      - name: Capture source and test evidence
        if: always()
        run: git archive --format=tar -o source.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-movement-source-report
          path: |
            received-payload.txt
            automatic-node-tests.txt
            source.tar
            dist/
          retention-days: 14
