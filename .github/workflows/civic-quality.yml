name: Civic corridor phase 3
on:
  push:
    branches: ['feat/civic-promenade-phase3']
  pull_request:
    paths: ['src/scene/civic/**', 'src/scene/civic.js', 'tests/civic*', 'scripts/assets/*civic*', '.github/workflows/civic-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  civic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm run check && npm test && npm run build
      - run: npm run assets:export && node scripts/assets/export-civic.mjs && npm run assets:review
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Exact phase 2 baseline, isolated from working branch
        run: |
          mkdir -p test-results/civic-baseline
          git archive 6b020530ac8ab46d0dd882ffcdfd67d00215b989 | tar -x -C test-results/civic-baseline
      - run: python tests/civic_browser.py
      - name: Exact sources
        if: always()
        run: git archive --format=tar -o source.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dicestrict-phase3-civic-evidence
          path: |
            test-results/civic/
            assets/
            dist/
            source.tar
          retention-days: 14
