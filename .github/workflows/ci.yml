name: DICESTRICT quality
on:
  push:
    paths: ['src/**', 'scripts/**', 'tests/**', 'config.js', 'index.html', 'package.json']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm run check && npm test && npm run build
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dicestrict-build-and-browser-report
          path: |
            dist/
            test-results/
          retention-days: 14
