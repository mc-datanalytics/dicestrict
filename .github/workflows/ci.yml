name: DICESTRICT quality
on:
  push:
    paths: ['src/**', 'scripts/**', 'tests/**', 'config.js', 'index.html', 'lab.html', 'package.json', '.github/workflows/ci.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm run check && npm test && npm run build
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run assets:export && npm run assets:review
      - run: python tests/browser.py
      - run: python tests/city_life_browser.py
      - run: python tests/districts_browser.py
      - run: npm run build:lab
      - run: python tests/lab_browser.py
      - name: Capture exact sources
        if: always()
        run: git archive --format=tar -o source.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dicestrict-build-and-browser-report
          path: |
            dist/
            test-results/
            source.tar
            assets/
          retention-days: 14

  # Each complete opening gets a clean runner and the original bounded budget.
  # Both matrix entries are required; every shard also verifies the lab import.
  sessions:
    name: sessions (${{ matrix.opening }})
    strategy:
      fail-fast: false
      matrix:
        opening: [classic, comp-60]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm run build:lab
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python -u tests/playtest_browser.py --opening "${{ matrix.opening }}"
        timeout-minutes: 22
      - name: Capture exact session sources
        if: always()
        run: |
          git rev-parse HEAD > test-results/session-commit.txt
          git archive --format=tar -o source.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dicestrict-full-sessions-${{ matrix.opening }}
          path: |
            test-results/
            source.tar
          retention-days: 14
