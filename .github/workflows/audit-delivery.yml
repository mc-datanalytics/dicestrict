name: Audited source delivery
on:
  push:
    branches: ['feat/fair-opening-playtests']
    paths: ['.github/workflows/audit-delivery.yml', '.github/audit-payload.txt', '.github/audit-followup.json']
permissions:
  contents: write
concurrency:
  group: audited-source-delivery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply bounded edits and verify every input and output
        run: |
          python - <<'PY'
          import pathlib, json, base64, gzip, hashlib
          encoded=pathlib.Path('.github/audit-payload.txt').read_text().strip()
          assert len(encoded)<30000
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(raw)<100000
          assert hashlib.sha256(raw).hexdigest()=='acb2787183926ff41cc119af4f533b3b1866d191cee7f24065e7d6267cb42636'
          sha=lambda text:hashlib.sha256(text.encode()).hexdigest()
          for edits in [json.loads(raw),json.loads(pathlib.Path('.github/audit-followup.json').read_text())]:
              for name,change in edits.items():
                  p=pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name=='package.json' or p.parts[0] in {'src','tests'}
                  if change['before'] is None:
                      assert not p.exists(),f'Unexpected file {name}'
                      text=change['content']
                  else:
                      text=p.read_text()
                      assert sha(text)==change['before'],f'Baseline mismatch: {name}'
                      for start,end,replacement in reversed(change['edits']):
                          assert 0<=start<=end<=len(text)
                          text=text[:start]+replacement+text[end:]
                  assert sha(text)==change['after'],f'Output mismatch: {name}'
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
                  print('Verified',name,change['after'])
          PY
      - name: Static checks, regressions and standalone builds
        run: |
          set -euo pipefail
          npm run check
          npm test | tee audit-node-tests.txt
          npm run build:lab
      - name: Publish plain source without modifying workflow files
        run: |
          git rm .github/audit-payload.txt .github/audit-followup.json
          git add src tests package.json
          git -c user.name='M&G Group' -c user.email='119437439+mc-datanalytics@users.noreply.github.com' commit -m 'fix: scope playtest exports, preserve results and make RTC delivery bounded and reliable'
          git push origin HEAD:refs/heads/feat/fair-opening-playtests
      - name: Capture exact tested sources
        if: always()
        run: tar -cf audit-source.tar src scripts tests docs README.md CHANGELOG.md SECURITY.md AGENTS.md package.json config.js index.html lab.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dicestrict-audit-source-and-node-tests
          path: |
            audit-source.tar
            audit-node-tests.txt
            dist/
          retention-days: 14
