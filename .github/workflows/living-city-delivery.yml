name: Living city verified delivery
on:
  push:
    branches: ['feat/living-city-0-4']
    paths: ['.github/workflows/living-city-delivery.yml', '.github/living-delta-*.json']
permissions:
  contents: write
concurrency:
  group: living-city-delivery
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply source edits with before and after SHA-256 verification
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path('.')
          sha=lambda s:hashlib.sha256(s.encode()).hexdigest()
          allowed={'README.md','CHANGELOG.md','SECURITY.md','package.json'}
          for filename in ['.github/living-delta-a.json','.github/living-delta-b.json']:
              for name,patch in json.loads(pathlib.Path(filename).read_text()).items():
                  p=pathlib.Path(name)
                  assert '..' not in p.parts and not p.is_absolute()
                  assert name in allowed or p.parts[0] in {'src','scripts','tests','docs'}
                  source=p.read_text()
                  assert sha(source)==patch['sha'],f'Baseline mismatch: {name}'
                  for start,end,text in reversed(patch['edits']):
                      source=source[:start]+text+source[end:]
                  assert sha(source)==patch['out'],f'Output mismatch: {name}'
                  p.write_text(source)
                  print('Verified',name,patch['out'])
          expected={
            'src/game/casino.js':'8f9d726f9a12d4fbf17d9cfe917d23d9b64603a4dec45e06093866c2399ee379',
            'src/scene/city-state.js':'64ca800eeb208301acb96b3a7bc23fb31788d7aa7227a161286acbffb3bd5600',
            'src/scene/living-city.js':'e6529beda1727753f7eb9ee10dc26e2ddde419a5558543a07672989ac47c2a68',
            'src/ui/casino-view.js':'67c14ce2fd499e78146d95ddcef9fceb45b7cc353c42d68a9f7c4cbc774449ce',
            'tests/living-city.test.mjs':'60f83c8c69e63d009d2f836cdf1fb52e939fc27ad844deb0dca0bf6c5e17c940',
            'docs/LIVING_CITY.md':'f3e65dfa86a07470357ba680474f70175ccc7759bc12e62456c46bca8d4cead5',
          }
          for name,digest in expected.items():
              assert sha(pathlib.Path(name).read_text())==digest,f'New-file mismatch: {name}'
          PY
      - name: Check, test and build
        run: |
          set -o pipefail
          npm run check && npm test | tee node-tests.txt
          npm run build
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Real WebGL2 and WebRTC browser tests
        run: python tests/browser.py
      - name: Publish verified sources on the feature branch only
        run: |
          git rm .github/living-delta-a.json .github/living-delta-b.json .github/workflows/living-city-delivery.yml
          git add src scripts tests docs README.md CHANGELOG.md SECURITY.md package.json
          git -c user.name='M&G Group' -c user.email='119437439+mc-datanalytics@users.noreply.github.com' commit -m 'feat: living city and optional match-credit casino, validated in Chromium'
          git push origin HEAD:refs/heads/feat/living-city-0-4
      - name: Capture exact tested sources
        if: always()
        run: tar -cf tested-source.tar src scripts tests docs README.md CHANGELOG.md SECURITY.md package.json config.js index.html AGENTS.md .github/workflows/ci.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dicestrict-living-city-build-and-browser-report
          path: |
            dist/
            test-results/
            node-tests.txt
            tested-source.tar
          retention-days: 14
