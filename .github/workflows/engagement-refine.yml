name: Engagement mobile stage refinement
on:
  push:
    branches: ['feat/engagement-rhythm-0-7']
    paths: ['.github/workflows/engagement-refine.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Apply exact layout correction
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          p=Path('src/ui/styles.css');s=p.read_text()
          assert sha256(s.encode()).hexdigest()=='ca8e11a249eabddd608a8520cddcbd3f5184ad931548a2d372f07633b4879574'
          old='@media(max-width:700px){.action-dock{position:relative;'
          new='@media(max-width:700px){.stage{height:auto;max-height:none}.action-dock{position:relative;'
          assert s.count(old)==1;s=s.replace(old,new)
          assert sha256(s.encode()).hexdigest()=='778832a9116a0cd9a8d41cacea8892237f92241145bce4d400d15b2dec7319c4'
          p.write_text(s)
          PY
      - name: Publish plain CSS on feature branch
        run: |
          git add src/ui/styles.css
          git -c user.name='M&G Group' -c user.email='119437439+mc-datanalytics@users.noreply.github.com' commit -m 'fix: preserve intrinsic mobile stage height with variable action rows'
          git push origin HEAD:refs/heads/feat/engagement-rhythm-0-7
