name: Engagement source delivery
on:
  push:
    branches: ['feat/engagement-rhythm-0-7']
    paths: ['.github/engagement-part-*.txt', '.github/workflows/engagement-delivery.yml']
permissions:
  contents: write
concurrency:
  group: engagement-source-delivery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify and materialize source
        run: |
          python - <<'PY'
          import pathlib, base64, gzip, hashlib, json
          encoded=''.join(pathlib.Path(f'.github/engagement-part-{i}.txt').read_text().strip() for i in range(3))
          pathlib.Path('received-payload.txt').write_text(encoded)
          # Correct identified transcription mistakes in this transport only.
          # Nothing is applied unless the canonical SHA-256 and all file hashes agree.
          encoded=encoded.replace('pPJwAcp+cs','pPJwA4cp+cs').replace('PxwMpG//','PxwMG//').replace('H45Yu3G168','H45Yu3z168')
          assert len(encoded)<40000
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(raw)<100000
          assert hashlib.sha256(raw).hexdigest()=='c644aaa7b61d2c6459facc605f83bf78efe812b826f9c4c7c82eabf342174f9a'
          sha=lambda text:hashlib.sha256(text.encode()).hexdigest()
          allowed={'src/ui/app.js','src/ui/deals-view.js','src/ui/styles.css','src/ui/momentum.js','src/ui/momentum-view.js','tests/momentum.test.mjs','tests/engagement_browser.py','package.json','README.md','CHANGELOG.md','docs/ENGAGEMENT_0_7.md'}
          patches=json.loads(raw)
          assert set(patches)==allowed
          for name,patch in patches.items():
              p=pathlib.Path(name)
              if patch['before'] is None:
                  assert not p.exists(),f'Unexpected existing file {name}'
                  text=patch['content']
              else:
                  text=p.read_text()
                  assert sha(text)==patch['before'],f'Baseline mismatch {name}'
                  for start,end,replacement in reversed(patch['edits']):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              assert sha(text)==patch['after'],f'Output mismatch {name}'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
              print('Verified',name,patch['after'])
          PY
      - name: Check, regressions and builds
        run: |
          set -euo pipefail
          npm run check
          npm test | tee engagement-node-tests.txt
          npm run build:lab
      - name: Publish source only on feature branch
        run: |
          git rm .github/engagement-part-*.txt
          git add src/ui tests docs/ENGAGEMENT_0_7.md package.json README.md CHANGELOG.md
          git -c user.name='M&G Group' -c user.email='119437439+mc-datanalytics@users.noreply.github.com' commit -m 'feat: visible goals, editable deal hints, solo offer pacing and session stories'
          git push origin HEAD:refs/heads/feat/engagement-rhythm-0-7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engagement-source-delivery-report
          path: |
            received-payload.txt
            engagement-node-tests.txt
          retention-days: 7
