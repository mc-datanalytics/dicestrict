name: Finalize DICESTRICT browser validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-project.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply reviewed ESM correction and improve failure diagnostics
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path);s=p.read_text()
              if old not in s:
                  assert new in s, 'Unexpected source state: '+path
                  return
              assert s.count(old)==1
              p.write_text(s.replace(old,new))
          replace('src/ui/app.js','await Promise.resolve().then(()=>require("../scene/board-scene.js"))','await import("../scene/board-scene.js")')
          old="const source=await readFile(file,'utf8');"
          replace('scripts/check.mjs',old,old+"if(file.startsWith(join(root,'src')+'/')&&/\\brequire\\s*\\(/.test(source))throw Error(`CommonJS require in browser ESM: ${file}`);")
          replace('tests/browser.py',"    assert await page.locator('.scene-error').count()==0, 'WebGL2 renderer did not initialize'","    if await page.locator('.scene-error').count():\n        await page.screenshot(path=str(OUT/'renderer-failure.png'),full_page=True)\n        raise AssertionError(await page.locator('.scene-error').inner_text())")
          replace('tests/browser.py',"    except Exception:\n        (OUT/'failure.txt').write_text(traceback.format_exc());raise","    except Exception:\n        failure=traceback.format_exc()\n        if browser:\n            for i,ctx in enumerate(browser.contexts):\n                for j,page in enumerate(ctx.pages):\n                    try:\n                        await page.screenshot(path=str(OUT/f'failure-{i}-{j}.png'),full_page=True)\n                        (OUT/f'failure-{i}-{j}.html').write_text(await page.content())\n                    except Exception: pass\n        (OUT/'failure.txt').write_text(failure);raise")
      - run: npm run check && npm test && npm run build
      - name: Publish source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/app.js scripts/check.mjs tests/browser.py
          git diff --cached --quiet || git commit -m 'fix: use native browser import for lazy 3D initialization'
          git push origin HEAD:main
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dicestrict-build-and-browser-report
          path: |
            dist/
            test-results/
          retention-days: 14
