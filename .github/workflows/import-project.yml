name: Import and validate DICESTRICT 0.2
on:
  push:
    branches: [main]
    paths: ['.bootstrap/READY']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and unpack the locally tested source snapshot
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, shutil
          root = pathlib.Path.cwd().resolve()
          encoded = ''.join(p.read_text().strip() for p in sorted((root/'.bootstrap').glob('payload-*.txt')))
          raw = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(raw).hexdigest() == '1c8fbc472f132fb38422781472ea397e508dcdb7b16354e7b9bb18f8a94faeab', 'Source checksum mismatch'
          files = json.loads(lzma.decompress(raw, memlimit=128*1024*1024))
          assert isinstance(files, dict) and len(files) == 32
          allowed_roots = {'README.md','CHANGELOG.md','SECURITY.md','package.json','index.html','config.js','.gitignore','.env.example'}
          for name, text in files.items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name in allowed_roots or path.parts[0] in {'src','scripts','tests','docs'}
              assert isinstance(text, str) and len(text.encode()) < 100000
              target = root/name
              assert target.resolve().is_relative_to(root)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          shutil.rmtree(root/'.bootstrap')
          print('Verified and restored 32 source files.')
      - name: Validate source, rules, protocol, signaling and build
        run: npm run check && npm test && npm run build
      - name: Publish verified source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import DICESTRICT 0.2 with auctions, WebRTC, tests and reproducible build'
          git push origin HEAD:main
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Real browser rendering and multiplayer tests
        run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dicestrict-build-and-browser-report
          path: |
            dist/
            test-results/
          retention-days: 14
