name: Phase 4 first family and resource validation
on:
  push:
    branches: [feat/city-harmony-phase4]
    paths: [.github/workflows/phase4-first.yml]
permissions:
  contents: write
jobs:
  first:
    if: github.ref == 'refs/heads/feat/city-harmony-phase4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Apply four hash-verified rendering edits on this branch only
        run: |
          python .github/phase4-first-edits.py
          git diff --exit-code 887d1548d7d451552ec9e12e0e4778a0fad2acf3 -- src/game src/network src/ui src/lab
          git config user.name 'M&G Group'
          git config user.email '119437439+mc-datanalytics@users.noreply.github.com'
          git add src/scene/board-scene.js src/scene/living-city.js src/scene/districts/review.js src/scene/marina/mesh-builder.js
          git rm .github/phase4-first-edits.py .github/workflows/phase4-first.yml
          git commit -m 'feat: connect Roseraie and restore cached GPU resources; remove one-shot transport'
          git push origin HEAD:refs/heads/feat/city-harmony-phase4
      - run: npm run check && npm test && npm run build
      - run: npm run assets:export && node scripts/assets/export-civic.mjs && node scripts/assets/export-harmony.mjs && npm run assets:review
      - run: pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Pin the integrated pre-art baseline
        run: |
          mkdir -p test-results/harmony-baseline
          git archive b75d7853457e12cac6e903da6cba4f62af3de0c0 | tar -x -C test-results/harmony-baseline
      - run: python tests/harmony_browser.py
      - run: python tests/shadow_browser.py
      - name: Exact tested sources
        if: always()
        run: |
          git rev-parse HEAD > test-results/tested-commit.txt
          git archive --format=tar -o source.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-first-family
          path: |
            source.tar
            assets/
            dist/
            test-results/harmony/
            test-results/shadow/
            test-results/tested-commit.txt
          retention-days: 14
