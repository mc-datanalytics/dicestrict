name: City response validated delivery
on:
  push:
    branches: ['feat/city-response-continuity']
    paths: ['.github/workflows/city-response-delivery.yml', '.github/delivery/city-response.gz.part*']
permissions:
  contents: write
jobs:
  validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact reviewed patch on preserved main baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/city-response-continuity
          git merge-base --is-ancestor b5f547c97ce8387f1c31b25bef3a29952d0a94a7 HEAD
          cat .github/delivery/city-response.gz.part{0,1,2,3} > "$RUNNER_TEMP/city-response.patch.gz"
          echo "93489cd64d1f5123f8aad0d59e6da47cbf81cace5c3c71b21f5f189000f5bab7  $RUNNER_TEMP/city-response.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/city-response.patch.gz" > "$RUNNER_TEMP/city-response.patch"
          echo "ca3a77dc702ba91017edda36a1331a531c71033228bf262ad7274b3d9d4bbabd  $RUNNER_TEMP/city-response.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/city-response.patch"
          git apply --index "$RUNNER_TEMP/city-response.patch"
          git rm .github/delivery/city-response.gz.part{0,1,2,3} .github/workflows/city-response-delivery.yml
          git diff --cached --check
          git diff --cached --stat
      - name: Syntax, deterministic rules, city models and builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery-logs
          npm run check | tee delivery-logs/check.txt
          npm test | tee delivery-logs/node-tests.txt
          npm run build | tee delivery-logs/build.txt
          npm run assets:export && npm run assets:review
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Existing real Chromium and WebRTC regression suite
        run: python -u tests/browser.py
      - name: City response, economy actions, GPU and accessibility
        run: python -u tests/city_life_browser.py
      - run: python -u tests/districts_browser.py
      - run: npm run build:lab && python -u tests/lab_browser.py
      - name: Publish validated sources to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/city-response-continuity | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --check
          git config user.name 'M&G Group'
          git config user.email '119437439+mc-datanalytics@users.noreply.github.com'
          git commit -m 'feat: responsive city life, continuous traffic and parcel activity insights' -m 'Preserve main b5f547c and all authored districts. Local visual actors retain positions through purchases and upgrades; buses stop, cranes articulate, property insight reflects economy. Rules, protocol v5 and match-credit-only casino unchanged. Publish only after Node, WebGL2, offline, WebRTC, districts and lab tests pass.'
          git push origin HEAD:refs/heads/feat/city-response-continuity
          git rev-parse HEAD > delivery-logs/published-commit.txt
      - name: Capture exact tested source tree even on failure
        if: always()
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -cf source.tar
          git diff --cached --stat > delivery-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dicestrict-city-response-validation
          path: |
            source.tar
            dist/
            test-results/
            delivery-logs/
            delivery-diff.txt
          retention-days: 14
